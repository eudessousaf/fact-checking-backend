[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factcheck"
version = "0.1.0"
description = "Checagem de fatos de debate presidencial: captura, transcrição, checagem e publicação"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    # format-nongpl traz os validadores de date-time e uri; sem ele o
    # jsonschema IGNORA o "format" em silêncio.
    "jsonschema[format-nongpl]>=4.23,<5",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
factcheck = "factcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
